version: '3'

vars:
  BIN: wtemp
  DIST: dist
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  PLATFORMS: linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64
  INSTALL_DIR:
    sh: echo "$HOME/.local/bin"

tasks:
  default:
    desc: 사용 가능한 태스크 목록 출력
    silent: true
    cmds:
      - task --list

  # --- 빌드 ---

  build:
    desc: 현재 플랫폼용 빌드
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/wtemp

  release:
    desc: 전체 플랫폼 릴리스 빌드 (dist/)
    cmds:
      - task: clean
      - mkdir -p {{.DIST}}
      - |
        set -e
        for target in {{.PLATFORMS}}; do
          os="${target%_*}"
          arch="${target#*_}"
          out="{{.DIST}}/{{.BIN}}_${target}"
          if [ "$os" = "windows" ]; then
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "{{.LDFLAGS}}" -o "${out}.exe" ./cmd/wtemp
            (cd {{.DIST}} && zip "{{.BIN}}_${target}.zip" "{{.BIN}}_${target}.exe" && rm "{{.BIN}}_${target}.exe")
          else
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "{{.LDFLAGS}}" -o "${out}" ./cmd/wtemp
            tar -czf "${out}.tar.gz" -C {{.DIST}} "{{.BIN}}_${target}"
            rm "${out}"
          fi
        done
      - 'echo "빌드 버전: {{.VERSION}}"'
      - 'echo "릴리스 완료: {{.DIST}}/"'
      - ls -lh {{.DIST}}/

  clean:
    desc: 빌드 산출물 삭제
    cmds:
      - rm -f {{.BIN}}
      - rm -rf {{.DIST}}

  # --- 테스트 (TDD) ---

  test:
    desc: 단위 테스트 실행 (캐시 무시, -count=1)
    cmds:
      - go test -count=1 ./...

  test-race:
    desc: 데이터 레이스 탐지 포함 테스트 실행
    cmds:
      - go test -race -count=1 ./...

  test-watch:
    desc: 파일 변경 시 자동으로 테스트 재실행 (watchexec 필요)
    cmds:
      - watchexec -e go -- go test -count=1 ./...

  coverage:
    desc: 테스트 커버리지 측정 및 요약 출력 (coverage.out 생성)
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  coverage-html:
    desc: 커버리지 HTML 리포트 생성 (coverage.html)
    deps:
      - coverage
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "리포트: coverage.html"'

  coverage-check:
    desc: 커버리지 임계값(85%) 검증
    cmds:
      - go test -count=1 -coverprofile=coverage.out ./...
      - |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
        echo "total coverage: ${total}%"
        awk -v t="$total" 'BEGIN { if (t + 0 < 85) { print "커버리지 임계값 미달: " t "% < 85%"; exit 1 } }'

  bench:
    desc: 생성 성능 벤치마크
    cmds:
      - go test -run '^$$' -bench . -benchmem ./generator

  lint:
    desc: 포맷·정적 검사 (gofmt + go vet)
    cmds:
      - test -z "$(gofmt -l .)" || (echo "gofmt 위반 파일:" && gofmt -l . && exit 1)
      - go vet ./...

  vuln:
    desc: 알려진 취약점 검사 (govulncheck 필요)
    cmds:
      - |
        if ! command -v govulncheck >/dev/null 2>&1; then
          echo "govulncheck가 없습니다: go install golang.org/x/vuln/cmd/govulncheck@latest"
          exit 1
        fi
        govulncheck ./...

  smoke:
    desc: 생성된 템플릿의 go build 검증 (-tags=smoke)
    cmds:
      - go test -tags=smoke ./generator -run TestSmokeGeneratedTemplatesBuild -count=1

  # --- 설치 / 삭제 ---

  install:
    desc: 빌드 후 ~/.local/bin 에 설치
    cmds:
      - task: build
      - cp {{.BIN}} {{.INSTALL_DIR}}/{{.BIN}}
      - 'echo "설치 완료: {{.INSTALL_DIR}}/{{.BIN}}"'

  uninstall:
    desc: ~/.local/bin 에서 설치된 바이너리 제거
    cmds:
      - rm -f {{.INSTALL_DIR}}/{{.BIN}}
      - 'echo "삭제 완료: {{.INSTALL_DIR}}/{{.BIN}}"'

  # --- 사용법 ---

  help:
    desc: wtemp 사용법 출력
    silent: true
    cmds:
      # 플래그 목록은 바이너리 도움말을 단일 소스로 사용한다(문서 드리프트 방지).
      - go run ./cmd/wtemp --help
      - go run ./cmd/wtemp new --help
      - go run ./cmd/wtemp list --help
      - go run ./cmd/wtemp list
      - 'echo "Task 목록: task --list"'
