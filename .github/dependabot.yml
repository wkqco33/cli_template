version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # 갓 배포된 버전을 즉시 채택하지 않는다
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  # 액션은 커밋 SHA로 고정되어 있으므로 Dependabot이 갱신 PR을 만든다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # 갓 배포된 버전을 즉시 채택하지 않는다
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
