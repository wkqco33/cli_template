name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: verify before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # 릴리스 잡에서는 모듈 캐시를 사용하지 않는다(캐시 오염 방지)

      - name: Verify module and vet
        run: |
          go mod verify
          go vet ./...

      # 태그가 가리키는 커밋이 실제로 테스트를 통과한 상태인지 확인한다.
      - name: Unit tests
        run: go test -shuffle=on -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 자산 업로드
      id-token: write # provenance 서명
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # git describe가 태그를 보려면 전체 히스토리가 필요하다
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # 릴리스 잡에서는 모듈 캐시를 사용하지 않는다(캐시 오염 방지)

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release artifacts
        run: task release

      - name: Verify stamped version
        run: |
          set -euo pipefail
          test "$(git describe --tags --always)" = "$GITHUB_REF_NAME"
          tar -xzf "dist/wtemp_linux_amd64.tar.gz" -C /tmp
          /tmp/wtemp_linux_amd64 --version | grep -Fx "$GITHUB_REF_NAME"

      - name: Create SHA-256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in *.tar.gz *.zip; do
            sha256sum "$asset" > "$asset.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
