name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: verify before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false # 릴리스 잡에서는 모듈 캐시를 사용하지 않는다(캐시 오염 방지)

      - name: Verify module and vet
        run: |
          go mod verify
          go vet ./...

      # 태그가 가리키는 커밋이 실제로 테스트를 통과한 상태인지 확인한다.
      - name: Unit tests
        run: go test -shuffle=on -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 자산 업로드
      id-token: write # provenance 서명
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # git describe가 태그를 보려면 전체 히스토리가 필요하다
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false # 릴리스 잡에서는 모듈 캐시를 사용하지 않는다(캐시 오염 방지)

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release artifacts
        run: task release

      - name: Verify stamped version
        run: |
          set -euo pipefail
          test "$(git describe --tags --always)" = "$GITHUB_REF_NAME"
          tar -xzf "dist/wtemp_linux_amd64.tar.gz" -C /tmp
          /tmp/wtemp_linux_amd64 --version | grep -Fx "$GITHUB_REF_NAME"

      - name: Compose release notes
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # 체크아웃이 주석 태그 객체를 가져오지 않을 수 있으므로 명시적으로 받아 둔다.
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true

          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # CHANGELOG의 해당 버전 섹션을 우선 사용하고, 없으면 태그 메시지로 폴백한다.
          section=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)

          {
            if [ -n "${section//[[:space:]]/}" ]; then
              echo "## ${GITHUB_REF_NAME}"
              printf '%s\n' "$section"
            else
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            fi
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > "$NOTES_PATH"
          cat "$NOTES_PATH"

      - name: Create SHA-256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in *.tar.gz *.zip; do
            sha256sum "$asset" > "$asset.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
