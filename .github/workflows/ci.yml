name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (echo "gofmt 위반 파일:" && gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Build
        run: task build

      - name: Unit tests
        run: task test

      - name: Smoke build tests (generated templates compile)
        run: task smoke
